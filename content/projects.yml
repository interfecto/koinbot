# Koinos ecosystem projects — editable via pull request.
#
# To ADD A PROJECT: append an entry with id, name, url, category
# (emoji and tagline are optional).
#
# To ADD AN UPDATE for your project: append to its "updates" list:
#
#     updates:
#       - date: 2026-08-10
#         text: "V2 launched with support for XYZ"
#
# date is YYYY-MM-DD (quoted or unquoted); text may use Telegram HTML
# (<b>, <i>, <a href="...">). Updates appear in /updates (newest
# first, across all projects) and in /project <name>.
#
# Merged PRs go live on the bot within ~2 minutes.

